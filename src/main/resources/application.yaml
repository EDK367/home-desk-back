spring:
  application:
    name: home-desk-back

  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  springdoc:
    api-docs:
      enabled: false
    swagger-ui:
      enabled: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

home-desk:
  jwt:
    secret: ${JWT_KEY}
    expiracion-ms: 3600000
    refresh-expiracion-ms: 2592000000
    cookie:
      name: ${JWT_COOKIE_NAME}
      path: ${JWT_COOKIE_PATH}
      domain: ${JWT_COOKIE_DOMAIN}
      secure: ${JWT_COOKIE_SECURE}
      same-site: ${JWT_COOKIE_SAME_SITE}
      http-only: ${JWT_COOKIE_HTTP_ONLY}

  cors:
    allowed-origins:
      - ${HOME_DESK_FRONT}

  pepper:
    secret: ${PEPPER_SECRET}
